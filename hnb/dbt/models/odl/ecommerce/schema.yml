version: 2

models:
  - name: dim_product_category
    description: >
      Health & Wellness Product Category Hierarchy Dimension (`DISTSTYLE ALL`, `SORTKEY(category_id)`).
      Covers Vitamins & Supplements, Sports Nutrition, Natural Beauty, Food & Drink, Gut Health, and Weight Management.
    columns:
      - name: category_sk
        description: "Deterministic MD5 surrogate key."
        tests:
          - unique
          - not_null
      - name: category_id
        description: "Natural integer category identifier."
        tests:
          - unique
          - not_null
      - name: category_name
        description: "Display name of the product category."
        tests:
          - not_null
      - name: department
        description: "Commercial health & wellness department."
        tests:
          - not_null
      - name: margin_tier
        description: "Gross margin tier classification (`High`, `Medium`, `Standard`)."
        tests:
          - not_null
          - accepted_values:
              values: ['High', 'Medium', 'Standard']

  - name: map_payment_methods
    description: >
      Payment Gateway & Tender Type Reference Dimension (`DISTSTYLE ALL`, `SORTKEY(payment_method_id)`).
      Maps payment method IDs to gateway fee percentages and BNPL flags.
    columns:
      - name: payment_method_sk
        description: "Deterministic MD5 surrogate key."
        tests:
          - unique
          - not_null
      - name: payment_method_id
        description: "Natural integer payment method ID (1–6)."
        tests:
          - unique
          - not_null
      - name: payment_method_name
        description: "Payment tender name (Credit Card, PayPal, Apple Pay, Google Pay, Klarna, H&B Rewards Points)."
        tests:
          - not_null

  - name: fact_basket_items
    description: >
      Incremental E-Commerce Basket Line Items Fact Table (`DISTKEY(basket_id)`, `SORTKEY(added_at, brand, category_id)`).
      Enriched with product category hierarchy and margin tier.
    columns:
      - name: basket_item_sk
        description: "Deterministic MD5 surrogate key."
        tests:
          - unique
          - not_null
      - name: basket_item_id
        description: "Natural UUID for the basket line item."
        tests:
          - unique
          - not_null
      - name: basket_id
        description: "Parent checkout basket identifier."
        tests:
          - not_null
      - name: category_id
        description: "Foreign key to `dim_product_category`."
        tests:
          - not_null
          - relationships:
              to: ref('dim_product_category')
              field: category_id
      - name: total_price
        description: "Line item extended gross price in GBP."
        tests:
          - not_null

  - name: fact_basket_payments
    description: >
      Incremental E-Commerce Basket Payments Fact Table (`DISTKEY(customer_id)`, `SORTKEY(processed_at, brand)`).
      Co-located on `customer_id` to enable zero-redistribution joins with `fact_survey` and `fact_cx_tickets`.
    columns:
      - name: payment_sk
        description: "Deterministic MD5 surrogate key."
        tests:
          - unique
          - not_null
      - name: payment_id
        description: "Natural UUID for the payment transaction."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Customer identifier co-located with CX facts."
        tests:
          - not_null
      - name: payment_method_id
        description: "Foreign key to `map_payment_methods`."
        tests:
          - not_null
          - relationships:
              to: ref('map_payment_methods')
              field: payment_method_id
      - name: gross_amount
        description: "Gross checkout transaction value in GBP."
        tests:
          - not_null
      - name: net_settlement_amount
        description: "Net revenue after deducting payment gateway merchant fees."
        tests:
          - not_null
