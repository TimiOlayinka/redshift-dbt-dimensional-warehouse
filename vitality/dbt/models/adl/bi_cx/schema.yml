version: 2

models:
  - name: bi_cx_executive_summary
    description: >
      Executive Monthly Customer Experience KPI Mart (`adl.bi_cx_executive_summary`).
      Consolidates omnichannel Net Promoter Score (Post-Ship & VisitView), Zendesk CSAT score,
      First-Contact Resolution (FCR %), and 24-hour SLA breach rate by brand and month.
    columns:
      - name: summary_sk
        description: "Primary composite surrogate key (`MD5(brand || '|' || report_month)`)."
        tests:
          - unique
          - not_null
      - name: brand
        description: "Canonical Vitality Retail Group retail brand."
        tests:
          - not_null
          - accepted_values:
              values: ['Vitality Retail', 'Vitality International', 'PureBotanics', 'NutriCore Partner', 'AromaVita']
      - name: report_month
        description: "First day of the reporting calendar month."
        tests:
          - not_null
      - name: total_nps_responses
        description: "Total validated NPS survey responses across Post-Ship and VisitView streams."
        tests:
          - not_null
      - name: nps_score
        description: "Blended Net Promoter Score (`(% Promoters - % Detractors) * 100`, range -100 to +100)."
      - name: total_tickets
        description: "Total customer support tickets opened during the reporting month."
        tests:
          - not_null
      - name: avg_csat_score
        description: "Mean Customer Satisfaction rating (1.00 to 5.00 scale)."
      - name: first_contact_resolution_pct
        description: "Percentage of support tickets resolved within the 4-hour First-Contact Resolution SLA."
      - name: sla_breach_rate_pct
        description: "Percentage of support tickets breaching the 24-hour resolution SLA."

  - name: bi_cx_revenue_uplift_attribution
    description: >
      Commercial CX-to-Revenue Attribution Mart (`adl.bi_cx_revenue_uplift_attribution`).
      Quantifies how shifting Detractors to Promoters and achieving First-Contact Resolution (FCR)
      drives repeat purchase velocity, higher Average Order Value (AOV), and £6.4M ($5.7M) annual incremental revenue uplift.
    columns:
      - name: attribution_sk
        description: "Deterministic MD5 surrogate key for the cohort slice."
        tests:
          - unique
          - not_null
      - name: brand
        description: "Canonical Vitality Retail Group brand."
        tests:
          - not_null
      - name: report_month
        description: "Reporting calendar month."
        tests:
          - not_null
      - name: nps_category
        description: "Customer NPS cohort (`Promoter`, `Passive`, `Detractor`)."
        tests:
          - not_null
          - accepted_values:
              values: ['Promoter', 'Passive', 'Detractor']
      - name: cohort_customers
        description: "Distinct count of customers in the attribution cohort."
        tests:
          - not_null
      - name: cohort_gross_revenue_gbp
        description: "Total gross settled e-commerce revenue (GBP) generated by the cohort."
        tests:
          - not_null
      - name: incremental_revenue_uplift_gbp
        description: "Incremental GBP revenue generated above the Detractor baseline per customer."
        tests:
          - not_null

unit_tests:
  - name: test_executive_summary_nps_and_csat_aggregation
    description: "Verifies net NPS calculation ((% Promoters - % Detractors) * 100) and CSAT / SLA breach aggregation in `bi_cx_executive_summary`."
    model: bi_cx_executive_summary
    given:
      - input: ref('fact_survey')
        rows:
          - {survey_sk: 'sk1', brand: 'Vitality Retail', response_date: '2026-05-10 10:00:00', survey_type: 'postship', nps_category: 'Promoter'}
          - {survey_sk: 'sk2', brand: 'Vitality Retail', response_date: '2026-05-12 10:00:00', survey_type: 'postship', nps_category: 'Promoter'}
          - {survey_sk: 'sk3', brand: 'Vitality Retail', response_date: '2026-05-15 10:00:00', survey_type: 'visitview', nps_category: 'Passive'}
          - {survey_sk: 'sk4', brand: 'Vitality Retail', response_date: '2026-05-18 10:00:00', survey_type: 'visitview', nps_category: 'Detractor'}
      - input: ref('fact_cx_tickets')
        rows:
          - {ticket_id: 't1', brand: 'Vitality Retail', created_at: '2026-05-05 09:00:00', csat_score: 5, is_positive_csat: true, resolution_time_hours: 2.0, is_first_contact_resolution: true, is_sla_breached: false}
          - {ticket_id: 't2', brand: 'Vitality Retail', created_at: '2026-05-06 09:00:00', csat_score: 3, is_positive_csat: false, resolution_time_hours: 30.0, is_first_contact_resolution: false, is_sla_breached: true}
    expect:
      rows:
        - {brand: 'Vitality Retail', report_month: '2026-05-01', total_nps_responses: 4, promoters: 2, passives: 1, detractors: 1, nps_score: 25.00, total_tickets: 2, avg_csat_score: 4.00, positive_csat_pct: 50.00, avg_resolution_time_hours: 16.00, first_contact_resolution_pct: 50.00, sla_breach_rate_pct: 50.00}
