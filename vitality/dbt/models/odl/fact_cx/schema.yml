version: 2

models:
  - name: fact_nps_postship
    description: >
      Incremental Kimball Fact table for post-delivery SMG Net Promoter Score (NPS) surveys.
      Co-located on `DISTKEY(customer_id)` with `SORTKEY(response_date, brand)`.
    columns:
      - name: survey_sk
        description: "Deterministic MD5 surrogate key (`MD5('postship|' || survey_id)`)."
        tests:
          - unique
          - not_null
      - name: survey_id
        description: "Natural survey response UUID."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Customer identifier co-located with e-commerce payments and tickets."
        tests:
          - not_null
      - name: nps_score
        description: "Integer NPS score between 0 and 10."
        tests:
          - not_null
      - name: nps_category
        description: "Derived NPS classification (`Promoter`, `Passive`, `Detractor`)."
        tests:
          - not_null
          - accepted_values:
              values: ['Promoter', 'Passive', 'Detractor']

  - name: fact_nps_visitview
    description: >
      Incremental Kimball Fact table for digital web and mobile app SMG VisitView intercept surveys.
      Configured with `DISTKEY(visitor_id)` and `SORTKEY(response_date, brand)`.
    columns:
      - name: survey_sk
        description: "Deterministic MD5 surrogate key (`MD5('visitview|' || survey_id)`)."
        tests:
          - unique
          - not_null
      - name: survey_id
        description: "Natural survey response UUID."
        tests:
          - unique
          - not_null
      - name: nps_category
        description: "Derived NPS classification (`Promoter`, `Passive`, `Detractor`)."
        tests:
          - not_null
          - accepted_values:
              values: ['Promoter', 'Passive', 'Detractor']

  - name: fact_survey
    description: >
      Unified Omnichannel NPS Fact Table combining post-fulfilment (`postship`) and digital browsing (`visitview`)
      surveys. Incremental `merge` strategy keyed on `survey_sk` with `DISTKEY(customer_id)` and
      `SORTKEY(response_date, brand, survey_type)`.
    columns:
      - name: survey_sk
        description: "Primary composite surrogate key (`MD5(survey_type || '|' || survey_id)`)."
        tests:
          - unique
          - not_null
      - name: survey_id
        description: "Source survey UUID."
        tests:
          - not_null
      - name: survey_type
        description: "Survey origin stream (`postship` or `visitview`)."
        tests:
          - not_null
          - accepted_values:
              values: ['postship', 'visitview']
      - name: platform
        description: "Feedback capture platform (`Web` or `App`)."
        tests:
          - not_null
          - relationships:
              to: ref('dim_feedback_platforms')
              field: platform_code
      - name: nps_score
        description: "Raw NPS rating (0 to 10)."
        tests:
          - not_null
      - name: nps_category
        description: "Standardized NPS segment (`Promoter`, `Passive`, `Detractor`)."
        tests:
          - not_null
          - accepted_values:
              values: ['Promoter', 'Passive', 'Detractor']
      - name: brand
        description: "Canonical Vitality Retail Group brand."
        tests:
          - not_null
          - accepted_values:
              values: ['Vitality Retail', 'Vitality International', 'PureBotanics', 'NutriCore Partner', 'AromaVita']

  - name: fact_cx_tickets
    description: >
      Incremental Fact Table for Zendesk Customer Care tickets, SLA compliance, First-Contact Resolution (FCR),
      and CSAT ratings. Co-located on `DISTKEY(customer_id)` with `SORTKEY(created_at, brand)`.
    columns:
      - name: ticket_fact_sk
        description: "Deterministic MD5 surrogate key."
        tests:
          - unique
          - not_null
      - name: ticket_id
        description: "Natural Zendesk ticket UUID."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_ticket')
              field: ticket_id
      - name: customer_id
        description: "Customer identifier."
        tests:
          - not_null
      - name: is_first_contact_resolution
        description: "Boolean flag indicating resolution within the 4-hour FCR SLA window."
        tests:
          - not_null
      - name: is_sla_breached
        description: "Boolean flag indicating ticket resolution exceeded the 24-hour SLA threshold."
        tests:
          - not_null

unit_tests:
  - name: test_nps_categorization_boundaries
    description: "Validates that `fact_nps_postship` accurately classifies boundary NPS scores (0, 6, 7, 8, 9, 10) into Detractor, Passive, and Promoter."
    model: fact_nps_postship
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_smg_nps_postship')
        rows:
          - {survey_id: 's-1', customer_id: 'CUST-1', customer_pii_hash: 'h1', order_id: 'ORD-1', response_date: '2026-05-01 10:00:00', nps_score: 10, nps_comment: 'Excellent', platform: 'App', brand: 'Vitality Retail'}
          - {survey_id: 's-2', customer_id: 'CUST-2', customer_pii_hash: 'h2', order_id: 'ORD-2', response_date: '2026-05-01 11:00:00', nps_score: 9,  nps_comment: 'Great',     platform: 'Web', brand: 'Vitality Retail'}
          - {survey_id: 's-3', customer_id: 'CUST-3', customer_pii_hash: 'h3', order_id: 'ORD-3', response_date: '2026-05-01 12:00:00', nps_score: 8,  nps_comment: 'Good',      platform: 'Web', brand: 'PureBotanics'}
          - {survey_id: 's-4', customer_id: 'CUST-4', customer_pii_hash: 'h4', order_id: 'ORD-4', response_date: '2026-05-01 13:00:00', nps_score: 7,  nps_comment: 'Okay',      platform: 'App', brand: 'PureBotanics'}
          - {survey_id: 's-5', customer_id: 'CUST-5', customer_pii_hash: 'h5', order_id: 'ORD-5', response_date: '2026-05-01 14:00:00', nps_score: 6,  nps_comment: 'Slow',      platform: 'Web', brand: 'AromaVita'}
          - {survey_id: 's-6', customer_id: 'CUST-6', customer_pii_hash: 'h6', order_id: 'ORD-6', response_date: '2026-05-01 15:00:00', nps_score: 0,  nps_comment: 'Missing',   platform: 'Web', brand: 'AromaVita'}
    expect:
      rows:
        - {survey_id: 's-1', nps_score: 10, nps_category: 'Promoter'}
        - {survey_id: 's-2', nps_score: 9,  nps_category: 'Promoter'}
        - {survey_id: 's-3', nps_score: 8,  nps_category: 'Passive'}
        - {survey_id: 's-4', nps_score: 7,  nps_category: 'Passive'}
        - {survey_id: 's-5', nps_score: 6,  nps_category: 'Detractor'}
        - {survey_id: 's-6', nps_score: 0,  nps_category: 'Detractor'}
