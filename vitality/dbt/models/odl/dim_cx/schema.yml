version: 2

models:
  - name: dim_ticket
    description: >
      Kimball Customer Care Ticket Dimension (`DISTKEY(customer_id)`, `SORTKEY(brand, status, created_at)`).
      Stores ticket metadata, contact channel, enquiry reason, and operational priority tier.
    columns:
      - name: ticket_sk
        description: "Deterministic MD5 surrogate key (`MD5(ticket_id)`)."
        tests:
          - unique
          - not_null
      - name: ticket_id
        description: "Natural business key from Zendesk."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Customer account identifier."
        tests:
          - not_null
      - name: customer_pii_hash
        description: "SHA-256 pseudonymized customer hash for GDPR compliance."
        tests:
          - not_null
      - name: status
        description: "Current lifecycle state of the ticket."
        tests:
          - not_null
          - accepted_values:
              values: ['Open', 'Pending', 'Resolved', 'Closed']
      - name: priority_tier
        description: "Derived SLA urgency tier based on health/safety vs standard enquiry reasons."
        tests:
          - not_null
          - accepted_values:
              values: ['P1 - High Priority', 'P2 - Medium Priority', 'P3 - Standard']
      - name: brand
        description: "Canonical Vitality Retail Group brand name."
        tests:
          - not_null
          - accepted_values:
              values: ['Vitality Retail', 'Vitality International', 'PureBotanics', 'NutriCore Partner', 'AromaVita']

  - name: dim_feedback_platforms
    description: >
      Kimball Feedback Platform & Survey Channel Dimension (`DISTSTYLE ALL`, `SORTKEY(platform_code)`).
      Replicated across all Redshift compute nodes to eliminate broadcast redistribution during fact joins.
    columns:
      - name: platform_sk
        description: "Deterministic MD5 surrogate key."
        tests:
          - unique
          - not_null
      - name: platform_id
        description: "Canonical platform identifier (e.g., PLAT-01)."
        tests:
          - unique
          - not_null
      - name: platform_code
        description: "Platform join key (`Web`, `App`, `Email`, `Chat`, `Phone`, `Social Media`)."
        tests:
          - unique
          - not_null
      - name: channel_group
        description: "High-level omnichannel grouping."
        tests:
          - not_null
