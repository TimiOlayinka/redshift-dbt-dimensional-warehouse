version: 2

sources:
  - name: cx_raw
    description: >
      Raw Customer Experience (CX) JSONL payloads landed in Amazon S3 (`s3://vitality-data-lake/vitality/cx/`)
      and ingested into Amazon Redshift Serverless `rdl` schema via standardized `COPY ... FORMAT AS JSON 'noshred'`.
    schema: rdl
    loaded_at_field: _ingested_at
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    tables:
      - name: rdl_smg_nps_postship
        description: "Raw post-fulfilment Net Promoter Score (NPS) survey payloads from Service Management Group (SMG)."
        columns:
          - name: raw_data
            description: "Unshredded JSON payload (SUPER / VARCHAR(MAX)) containing post-delivery survey responses."
            tests:
              - not_null
          - name: _ingested_at
            description: "UTC timestamp when the S3 batch was loaded into Redshift RDL."

      - name: rdl_smg_nps_visitview
        description: "Raw digital web & app intercept Net Promoter Score (NPS) survey payloads from SMG VisitView."
        columns:
          - name: raw_data
            description: "Unshredded JSON payload containing digital browsing session NPS responses."
            tests:
              - not_null
          - name: _ingested_at
            description: "UTC timestamp when the S3 batch was loaded into Redshift RDL."

      - name: rdl_cx_tickets
        description: "Raw omnichannel Customer Care support tickets and CSAT survey payloads from Zendesk."
        columns:
          - name: raw_data
            description: "Unshredded JSON payload containing ticket lifecycle timestamps, contact reason, and CSAT rating."
            tests:
              - not_null
          - name: _ingested_at
            description: "UTC timestamp when the S3 batch was loaded into Redshift RDL."

models:
  - name: stg_cx_tickets
    description: "Cleaned, deduplicated, and type-safe staging view for Zendesk Customer Care support tickets."
    columns:
      - name: ticket_id
        description: "Primary natural key (UUID) identifying the support ticket."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Customer identifier associated with the support enquiry."
        tests:
          - not_null
      - name: customer_pii_hash
        description: "GDPR-compliant SHA-256 pseudonymized customer hash."
        tests:
          - not_null
      - name: status
        description: "Normalized ticket lifecycle state."
        tests:
          - accepted_values:
              values: ['Open', 'Pending', 'Resolved', 'Closed']
      - name: brand
        description: "Canonical Vitality Retail Group retail brand name."
        tests:
          - not_null
          - accepted_values:
              values: ['Vitality Retail', 'Vitality International', 'PureBotanics', 'NutriCore Partner', 'AromaVita']

  - name: stg_smg_nps_postship
    description: "Cleaned, deduplicated staging view for post-delivery SMG NPS survey responses."
    columns:
      - name: survey_id
        description: "Primary natural key (UUID) for the post-delivery survey response."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Customer identifier linked to the fulfilled order."
        tests:
          - not_null
      - name: order_id
        description: "E-commerce order identifier evaluated in the post-ship survey."
        tests:
          - not_null
      - name: nps_score
        description: "Validated integer Net Promoter Score on a 0–10 scale."
        tests:
          - not_null
      - name: brand
        description: "Canonical Vitality Retail Group retail brand name."
        tests:
          - not_null

  - name: stg_smg_nps_visitview
    description: "Cleaned, deduplicated staging view for digital web and mobile app SMG VisitView NPS surveys."
    columns:
      - name: survey_id
        description: "Primary natural key (UUID) for the digital intercept survey."
        tests:
          - unique
          - not_null
      - name: session_id
        description: "Digital browsing session identifier."
        tests:
          - not_null
      - name: nps_score
        description: "Validated integer Net Promoter Score on a 0–10 scale."
        tests:
          - not_null
